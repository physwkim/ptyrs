# Machine-local settings go in the untracked config.local.toml next to this file; see
# config.local.example.toml. Keys set here take precedence over it.
include = [{ path = "config.local.toml", optional = true }]

[env]
# Unlocks rustc_private / -Z for the cuda-oxide backend on the pinned stable.
RUSTC_BOOTSTRAP = "1"
CUDA_TOOLKIT_PATH = { value = "/usr/local/cuda-13.5", relative = false }
