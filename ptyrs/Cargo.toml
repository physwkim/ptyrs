[package]
name = "ptyrs"
version.workspace = true
edition.workspace = true
description = "ptyrs: GPU ptychography on cuda-rust, one host library plus the `ptyrs`, `pty-recv` and `pty-sim` binaries; burn neural networks behind the `nn` feature"

[features]
# ptyrs::nn on burn. Off by default, so burn and cubecl build only on request.
nn = ["dep:burn", "dep:burn-cubecl", "dep:burn-pack", "dep:cudarc", "dep:cubecl-runtime", "dep:rayon"]

[dependencies]
ptyrs-kernels = { path = "../ptyrs-kernels" }
cuda-core.workspace = true
cuda-async.workspace = true
cuda-bindings.workspace = true
cutile.workspace = true
num-complex.workspace = true
thiserror.workspace = true
rand.workspace = true
rand_chacha.workspace = true
rand_distr.workspace = true
rustfft.workspace = true
rust-hdf5 = { workspace = true, features = ["lz4"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
serde = { version = "1", features = ["derive"] }
toml = "1"
epics-pva-rs.workspace = true
# Block compression only; lz4 decode is C liblz4 (lz4-sys), which builds its vendored copy at -O3.
lz4_flex = { version = "0.11", default-features = false, features = ["std"] }
lz4-sys = "1.11"
bytes = "1"
crossbeam-channel = "0.5"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
libc = "0.2"
libloading = "0.8"
zmq = "0.10"
burn = { version = "0.22.1", default-features = false, features = ["std", "cuda", "autodiff", "optim", "extension"], optional = true }
# Named for the CubeCL tensor primitive the cuda-rust boundary reads. Fusion stays off: with it
# the primitive would be a fusion handle instead of a buffer. Persistence keeps autotune results
# and compiled kernels across processes, under the root ptyrs::nn::cuda sets.
burn-cubecl = { version = "0.22.1", default-features = false, features = ["std", "cuda", "autotune", "persistence"], optional = true }
# The tensor shapes of a saved predictor, which burn's ModuleRecord keeps private.
burn-pack = { version = "0.22.1", default-features = false, features = ["std"], optional = true }
# cudarc 0.19.10 knows CUDA up to 13.4 and panics on nvcc 13.5. Pinning its newest bindings here
# (driver API calls are forward compatible) unifies the feature into cubecl-cuda's copies; the
# build-dependency entry reaches the build-script graph, which resolver 2+ keeps separate.
cudarc = { version = "0.19.10", default-features = false, features = ["cuda-13040"], optional = true }
# For the `Runtime` trait that names cubecl's CUDA server; cubecl does not re-export it.
cubecl-runtime = { version = "0.11.4", default-features = false, optional = true }
rayon = { version = "1.12", optional = true }

[build-dependencies]
cuda-artifact-finalizer.workspace = true
nvjitlink-sys.workspace = true
oxide-artifacts = "0.2.1"
libloading = "0.8"
serde_json = "1"
cudarc = { version = "0.19.10", default-features = false, features = ["cuda-13040"], optional = true }

[lints.clippy]
# clippy.toml's disallowed methods are live's rule (DESIGN §5 inv. 9); the live module and
# live's binaries, examples and test turn the lint back on.
disallowed_methods = "allow"

# Discovered like every test and example; listed only to require the feature.
[[test]]
name = "nn_interop"
required-features = ["nn"]

[[test]]
name = "nn_metric"
required-features = ["nn"]

[[test]]
name = "nn_predictor"
required-features = ["nn"]

[[example]]
name = "nn_dip"
required-features = ["nn"]

[[example]]
name = "nn_dip_ptychi"
required-features = ["nn"]

[[example]]
name = "nn_m6_start"
required-features = ["nn"]

[[example]]
name = "nn_train_ptychonn"
required-features = ["nn"]
