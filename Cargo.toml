[workspace]
resolver = "3"
members = ["ptyrs-core", "ptyrs-engine", "ptyrs-fft", "ptyrs-gpu", "ptyrs-io", "ptyrs-kernels", "ptyrs-live", "ptyrs-cli"]

[workspace.package]
version = "0.0.1"
edition = "2024"

[workspace.dependencies]
# Local cuda-rust checkout, absolute so git worktrees resolve it too. cargo-oxide builds its backend
# from the same checkout, so host crates and backend stay on one commit.
cuda-bindings = { path = "/home/stevek/work/cuda-rust/cuda-bindings" }
cuda-core = { path = "/home/stevek/work/cuda-rust/cuda-core" }
cuda-async = { path = "/home/stevek/work/cuda-rust/cuda-async" }
cuda-device = { path = "/home/stevek/work/cuda-rust/cuda-oxide/crates/cuda-device" }
cuda-host = { path = "/home/stevek/work/cuda-rust/cuda-oxide/crates/cuda-host" }

# Host-side numerics and I/O shared by ptyrs-core, ptyrs-io and ptyrs-engine.
num-complex = "0.4"
thiserror = "2"
rand = "0.8"
rand_chacha = "0.3"
rand_distr = "0.4"
rustfft = "6"
rust-hdf5 = "0.7.12"
ptyrs-core = { path = "ptyrs-core" }
ptyrs-io = { path = "ptyrs-io" }
