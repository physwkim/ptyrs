# `cargo nextest run --profile one-gpu` is the suite for a run that sees one GPU: it leaves
# out the tests that need two or four. Each is named, so a new multi-GPU test fails under this
# profile until it is added here.
[profile.one-gpu]
default-filter = '''
not (package(ptyrs) & (
    test(=dist::ap::tests::ap_is_bit_identical_on_1_2_and_4_gpus)
  | test(=dist::exchange::tests::add_f32_and_max_u32_read_peers)
  | test(=dist::exchange::tests::copy_runs_reads_every_peer)
  | test(=dist::exchange::tests::halo_pull_reads_every_peer)
  | test(=dist::live::tests::every_gpu_copies_from_the_ring_in_place)
  | test(=dist::live::tests::gpus_exchange_the_halo_as_it_grows)
  | test(=dist::live::tests::the_uploader_fills_each_store_in_the_order_the_plan_numbers_its_frames)
  | test(=dist::live_ap::tests::gpus_iterate_a_live_scan_as_one_gpu)
  | test(=dist::p2p::tests::bench_times_every_ordered_pair_and_checks_the_data)
  | test(=dist::synth::synthetic_accumulation_is_bit_identical_on_1_2_and_4_gpus)
  | test(=dist::tomo::tests::a_failing_angle_releases_the_waiting_workers)
  | test(=dist::tomo::tests::angles_are_bit_identical_on_1_2_and_4_gpus)
  | test(=dist::tomo::tests::each_angle_starts_from_the_probe_lag_angles_before)
  | test(=dist::topo::tests::enables_every_pair)
  | test(=dist::topo::tests::topology_groups_numa_pairs_and_every_pair_has_p2p)
  | test(=dist::worker::tests::a_failing_worker_releases_the_others)
  | test(=dist::worker::tests::fence_orders_peer_writes_before_peer_reads)
  | test(=dist::worker::tests::fence_orders_side_stream_work)
  | test(=dist::worker::tests::init_failure_is_reported)
  | test(=dist::worker::tests::run_returns_after_every_worker_is_done_with_its_borrows)
  | test(=live::follow::tests::gpus_follow_a_stream_as_one_gpu_replays_its_landings)
))
'''
